# SPDX-License-Identifier: GPL-3.0-or-later
#
# Market Sano — backend (API FastAPI + MCP FastMCP)
# https://github.com/danielsalinasgongora/market-sano

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsano"
version = "0.1.0"
description = "Planificador de comidas local-first y MCP-first con precios reales del retail chileno"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    # MCP: pin a la línea 2.x (3.x/4.x en desarrollo con breaking changes; se re-evalúa en Fase 4)
    "fastmcp>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/danielsalinasgongora/market-sano"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
